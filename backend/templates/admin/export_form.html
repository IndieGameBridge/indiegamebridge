{% load admin_urls %}
{% comment %}
  The dropdown of a CsvExportAdminMixin's changelist: how many of the newest rows to
  download. Shown only when the admin has put export_sizes in the context.
{% endcomment %}
{% if export_sizes %}
  <div style="padding: 8px 10px; margin-bottom: 15px; background: var(--darkened-bg); border-top: 1px solid var(--hairline-color); border-bottom: 1px solid var(--hairline-color); color: var(--body-quiet-color);">
    <form method="get" action="{% url opts|admin_urlname:'export' %}">
      <label for="export-rows">Export the last</label>
      <select id="export-rows" name="rows">
        {% for size in export_sizes %}<option value="{{ size }}">{{ size }}</option>{% endfor %}
      </select>
      <span>rows as CSV</span>
      <input type="submit" value="Export">
    </form>
  </div>
{% endif %}
